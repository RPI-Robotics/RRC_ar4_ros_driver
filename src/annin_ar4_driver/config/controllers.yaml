/**/controller_manager:
  ros__parameters:
    update_rate: 60 # Hz

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

/**/joint_trajectory_controller:
  ros__parameters:
    joints:
      - $(var tf_prefix)base_to_link1
      - $(var tf_prefix)link1_to_link2
      - $(var tf_prefix)link2_to_link3
      - $(var tf_prefix)link3_to_end_effector_mount
      - $(var tf_prefix)endeffector_mount
      - $(var tf_prefix)endeffector
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 0.0
      $(var tf_prefix)base_to_link1: { trajectory: 0.2, goal: 0.02 }
      $(var tf_prefix)link1_to_link2: { trajectory: 0.2, goal: 0.02 }
      $(var tf_prefix)link2_to_link3: { trajectory: 0.2, goal: 0.02 }
      $(var tf_prefix)link3_to_end_effector_mount: { trajectory: 0.2, goal: 0.02 }
      $(var tf_prefix)endeffector_mount: { trajectory: 0.2, goal: 0.02 }
      $(var tf_prefix)endeffector: { trajectory: 0.2, goal: 0.02 }

    gains: # Required because we're controlling a velocity interface
      $(var tf_prefix)base_to_link1: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 } # Smaller 'p' term, since ff term does most of the work
      $(var tf_prefix)link1_to_link2: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 }
      $(var tf_prefix)link2_to_link3: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 }
      $(var tf_prefix)link3_to_end_effector_mount: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 }
      $(var tf_prefix)endeffector_mount: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 }
      $(var tf_prefix)endeffector: { p: 10.0, d: 1.0, i: 1.0, i_clamp: 1.0 }

    velocity_ff:
      $(var tf_prefix)base_to_link1: 1.0
      $(var tf_prefix)link1_to_link2: 1.0
      $(var tf_prefix)link2_to_link3: 1.0
      $(var tf_prefix)link3_to_end_effector_mount: 1.0
      $(var tf_prefix)endeffector_mount: 1.0
      $(var tf_prefix)endeffector: 1.0

/**/gripper_controller:
  ros__parameters:
    joint: $(var tf_prefix)gripper_jaw1_joint
